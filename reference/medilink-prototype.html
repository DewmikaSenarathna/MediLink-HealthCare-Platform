<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediLink — Community Healthcare Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#132C2A;
  --paper:#F5FAF8;
  --surface:#FFFFFF;
  --teal:#0E7C74;
  --teal-deep:#0A5D57;
  --teal-tint:#E4F3F1;
  --sky:#3E6FA6;
  --sky-tint:#E9F0F8;
  --amber:#E0A23A;
  --amber-tint:#FBF0DD;
  --coral:#C1483F;
  --coral-tint:#FBEAE8;
  --moss:#2F8F63;
  --moss-tint:#E7F5EE;
  --sand:#DEE8E5;
  --mist:#6C807D;
  --radius:14px;
  --radius-sm:9px;
  --shadow:0 1px 2px rgba(19,44,42,0.06), 0 8px 24px -12px rgba(19,44,42,0.15);
  --font-display:'Sora',ui-sans-serif,system-ui,sans-serif;
  --font-body:'Inter',ui-sans-serif,system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:-0.01em;color:var(--ink);}
p{margin:0;line-height:1.55;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}
a{color:inherit;}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:4px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

/* ===== Layout shells ===== */
.min-h{min-height:100vh;}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;background:
  radial-gradient(1100px 500px at 15% -10%, var(--teal-tint), transparent),
  radial-gradient(900px 500px at 110% 10%, var(--sky-tint), transparent), var(--paper);}
.auth-card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--sand);border-radius:20px;box-shadow:var(--shadow);padding:36px 32px;}
.auth-card.wide{max-width:960px;padding:0;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;}
.auth-card.wide .auth-side{background:linear-gradient(160deg,var(--teal-deep),var(--teal));color:#fff;padding:44px 36px;display:flex;flex-direction:column;justify-content:space-between;}
.auth-card.wide .auth-main{padding:36px 32px;}
@media(max-width:760px){.auth-card.wide{grid-template-columns:1fr;}.auth-card.wide .auth-side{display:none;}}

.app-shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh;}
@media(max-width:900px){.app-shell{grid-template-columns:1fr;}}
.sidebar{background:var(--surface);border-right:1px solid var(--sand);padding:22px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;}
@media(max-width:900px){.sidebar{display:none;}}
.side-logo{display:flex;align-items:center;gap:10px;padding:0 6px;}
.side-nav{display:flex;flex-direction:column;gap:3px;flex:1;}
.side-foot{border-top:1px solid var(--sand);padding-top:14px;display:flex;flex-direction:column;gap:3px;}

.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--mist);font-weight:600;font-size:14.5px;text-decoration:none;border:none;background:transparent;width:100%;text-align:left;}
.nav-item svg{flex-shrink:0;}
.nav-item:hover{background:var(--teal-tint);color:var(--teal-deep);}
.nav-item.active{background:var(--teal);color:#fff;}

.main-col{min-width:0;}
.topbar{display:none;}
@media(max-width:900px){
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--sand);position:sticky;top:0;z-index:30;}
}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:26px 32px 6px;flex-wrap:wrap;}
@media(max-width:900px){.page-head{padding:18px 16px 4px;}}
.page-body{padding:18px 32px 100px;}
@media(max-width:900px){.page-body{padding:14px 16px 96px;}}
.back-row{display:flex;align-items:center;gap:8px;padding:16px 32px 0;}
@media(max-width:900px){.back-row{padding:12px 16px 0;}}

.bottom-nav{display:none;}
@media(max-width:900px){
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--sand);padding:6px 4px 8px;justify-content:space-between;z-index:40;box-shadow:0 -6px 20px -14px rgba(0,0,0,0.25);}
  .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border:none;background:none;color:var(--mist);font-size:11px;font-weight:600;border-radius:10px;}
  .bn-item.active{color:var(--teal-deep);}
  .bn-item.active svg{color:var(--teal);}
}

.drawer-overlay{position:fixed;inset:0;background:rgba(19,44,42,0.4);z-index:50;display:flex;}
.drawer{background:var(--surface);width:78%;max-width:300px;height:100%;padding:18px 14px;display:flex;flex-direction:column;gap:18px;animation:slideIn .18s ease-out;}
@keyframes slideIn{from{transform:translateX(-16px);opacity:.4}to{transform:translateX(0);opacity:1}}

/* ===== Typography helpers ===== */
.eyebrow{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-deep);font-weight:500;}
.muted{color:var(--mist);}
.small{font-size:13px;}
.h-xl{font-size:34px;font-weight:800;line-height:1.1;}
.h-lg{font-size:26px;font-weight:700;line-height:1.2;}
.h-md{font-size:19px;font-weight:700;}
.h-sm{font-size:15.5px;font-weight:700;}
@media(max-width:600px){.h-xl{font-size:27px;}.h-lg{font-size:21px;}}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:11px;font-weight:700;font-size:14.5px;border:1.5px solid transparent;transition:transform .05s ease, background .15s;white-space:nowrap;}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--teal);color:#fff;}
.btn-primary:hover{background:var(--teal-deep);}
.btn-secondary{background:var(--surface);color:var(--teal-deep);border-color:var(--teal);}
.btn-secondary:hover{background:var(--teal-tint);}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--sand);}
.btn-ghost:hover{background:var(--sand);}
.btn-danger{background:var(--coral);color:#fff;}
.btn-danger:hover{background:#a53a32;}
.btn-danger-ghost{background:var(--coral-tint);color:var(--coral);border-color:var(--coral-tint);}
.btn-block{width:100%;}
.btn-lg{padding:15px 22px;font-size:15.5px;border-radius:13px;}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:9px;}
.btn:disabled{opacity:.55;cursor:not-allowed;}
.btn-icon{padding:9px;border-radius:10px;}

/* ===== Cards / surfaces ===== */
.card{background:var(--surface);border:1px solid var(--sand);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
.card-flat{background:var(--surface);border:1px solid var(--sand);border-radius:var(--radius);padding:20px;}
.grid{display:grid;gap:16px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.grid-3{grid-template-columns:1fr 1fr;}.grid-4{grid-template-columns:1fr 1fr;}}
@media(max-width:600px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
.row{display:flex;gap:10px;align-items:center;}
.between{justify-content:space-between;}
.wrap{flex-wrap:wrap;}
.stack{display:flex;flex-direction:column;gap:10px;}
.divider{height:1px;background:var(--sand);border:none;margin:14px 0;}

/* ===== Forms ===== */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.field label{font-weight:700;font-size:13.5px;}
.field .hint{color:var(--mist);font-size:12.5px;}
.field .error{color:var(--coral);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:5px;}
.input, select.input{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--sand);background:#fff;font-size:15px;color:var(--ink);}
.input:focus{border-color:var(--teal);}
.input.err{border-color:var(--coral);background:var(--coral-tint);}
.input-icon-wrap{position:relative;}
.input-icon-wrap .input{padding-right:44px;}
.input-icon-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--mist);padding:6px;border-radius:8px;}
.checkbox-row{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;line-height:1.4;}
.checkbox-row input{margin-top:3px;width:17px;height:17px;accent-color:var(--teal);}

/* ===== Badges / status ===== */
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:100px;font-size:12.5px;font-weight:700;}
.badge.b-avail{background:var(--moss-tint);color:var(--moss);}
.badge.b-limited{background:var(--amber-tint);color:#9a6a13;}
.badge.b-unavail{background:var(--coral-tint);color:var(--coral);}
.badge.b-neutral{background:var(--sand);color:var(--mist);}
.badge.b-info{background:var(--sky-tint);color:var(--sky);}

/* ===== Alerts ===== */
.alert{display:flex;gap:11px;padding:13px 15px;border-radius:12px;font-size:14px;align-items:flex-start;}
.alert-error{background:var(--coral-tint);color:#8f342c;}
.alert-info{background:var(--sky-tint);color:#2b537c;}
.alert-success{background:var(--moss-tint);color:#256f4c;}
.alert svg{flex-shrink:0;margin-top:1px;}

/* ===== Doctor / appointment cards ===== */
.doc-card{display:flex;gap:14px;padding:18px;border:1px solid var(--sand);border-radius:var(--radius);background:var(--surface);}
.avatar{width:52px;height:52px;border-radius:14px;background:var(--teal-tint);color:var(--teal-deep);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:17px;flex-shrink:0;}
.appt-card{border:1px solid var(--sand);border-radius:var(--radius);background:var(--surface);padding:16px 18px;}

/* ===== Chips (date/time selectors) ===== */
.chip-row{display:flex;flex-wrap:wrap;gap:9px;}
.chip{padding:10px 16px;border-radius:11px;border:1.5px solid var(--sand);background:#fff;font-weight:700;font-size:14px;color:var(--ink);}
.chip.selected{background:var(--teal);border-color:var(--teal);color:#fff;}
.chip:disabled{color:var(--mist);background:var(--sand);border-color:var(--sand);text-decoration:line-through;cursor:not-allowed;}

/* ===== Tables ===== */
.table-wrap{overflow-x:auto;border:1px solid var(--sand);border-radius:var(--radius);background:var(--surface);}
table{width:100%;border-collapse:collapse;min-width:640px;}
th{text-align:left;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mist);padding:13px 16px;border-bottom:1px solid var(--sand);background:var(--paper);}
td{padding:13px 16px;border-bottom:1px solid var(--sand);font-size:14px;}
tr:last-child td{border-bottom:none;}

/* ===== Pulse tracker (signature element) ===== */
.pulse-track{display:flex;align-items:center;margin:4px 0 2px;}
.pulse-node-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;}
.pulse-node{width:15px;height:15px;border-radius:50%;background:var(--sand);border:2px solid var(--sand);}
.pulse-node.done{background:var(--teal);border-color:var(--teal);}
.pulse-node.active{background:#fff;border-color:var(--teal);box-shadow:0 0 0 5px var(--teal-tint);}
.pulse-label{font-size:10.5px;font-weight:700;color:var(--mist);text-align:center;max-width:64px;}
.pulse-label.on{color:var(--teal-deep);}
.pulse-seg{flex:1;height:22px;display:flex;align-items:center;min-width:16px;}
.pulse-seg svg{width:100%;height:22px;overflow:visible;}
.pulse-line-done{stroke:var(--teal);}
.pulse-line-todo{stroke:var(--sand);}
.pulse-beat{stroke:var(--teal);stroke-dasharray:70;stroke-dashoffset:70;animation:beatDraw 1.1s ease-in-out infinite;}
@keyframes beatDraw{0%{stroke-dashoffset:70;}55%{stroke-dashoffset:0;}100%{stroke-dashoffset:-70;}}

/* ===== Modal / toast ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(19,44,42,0.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal-box{background:#fff;border-radius:16px;max-width:400px;width:100%;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,0.25);}
#toast-root{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
@media(max-width:900px){#toast-root{bottom:82px;}}
.toast{background:var(--ink);color:#fff;padding:11px 18px;border-radius:100px;font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.25);animation:toastIn .18s ease-out;}
@keyframes toastIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ===== Spinner ===== */
.spinner{width:46px;height:46px;border-radius:50%;border:4px solid var(--sand);border-top-color:var(--teal);animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.container{max-width:1080px;margin:0 auto;}
.center{text-align:center;}
</style>
</head>

function nav(view, push){
  if(push!==false){ S.navStack.push(S.view); }
  S.view = view;
  S.drawerOpen = false;
  render();
  window.scrollTo(0,0);
}

  var prev = S.navStack.pop();
  S.view = prev || 'patientDashboard';
  S.drawerOpen = false;
  render();
  window.scrollTo(0,0);
}
function toast(msg){
  var root = document.getElementById('toast-root');
  var el = document.createElement('div');
  el.className='toast';
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(function(){ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(function(){ root.removeChild(el); },250); }, 2600);
}

function btn(label, opts){
  opts = opts||{};
  var cls = 'btn '+(opts.variant?('btn-'+opts.variant):'btn-primary')+(opts.block?' btn-block':'')+(opts.lg?' btn-lg':'')+(opts.sm?' btn-sm':'');
  var iconHtml = opts.icon ? ic(opts.icon,17) : '';
  var iconRightHtml = opts.iconRight ? ic(opts.iconRight,17) : '';
  return '<button type="button" '+(opts.id?('id="'+opts.id+'" '):'')+(opts.disabled?'disabled ':'')+'class="'+cls+'" onclick="'+(opts.onclick||'')+'">'+iconHtml+'<span>'+label+'</span>'+iconRightHtml+'</button>';
}
function badge(status){
  var map = {
    available:{cls:'b-avail', icon:'✓', label:'Available'},
    limited:{cls:'b-limited', icon:'⚠', label:'Limited availability'},
    unavailable:{cls:'b-unavail', icon:'✕', label:'Unavailable'},
    Confirmed:{cls:'b-avail', icon:'✓', label:'Confirmed'},
    Completed:{cls:'b-info', icon:'✓', label:'Completed'},
    Cancelled:{cls:'b-neutral', icon:'✕', label:'Cancelled'},
    'Pending Payment':{cls:'b-limited', icon:'⚠', label:'Pending Payment'},
    Paid:{cls:'b-avail', icon:'✓', label:'Paid'},
    Refunded:{cls:'b-info', icon:'↺', label:'Refunded'}
  };
  var m = map[status] || {cls:'b-neutral', icon:'●', label:status};
  return '<span class="badge '+m.cls+'">'+m.icon+' '+m.label+'</span>';
}
function medBadge(status){
  if(status==='available') return '<span class="badge b-avail">✓ Available</span>';
  if(status==='limited') return '<span class="badge b-limited">⚠ Limited stock</span>';
  return '<span class="badge b-unavail">✕ Unavailable</span>';
}
function field(labelText, innerHtml, opts){

}

/* Pulse tracker — signature element: an ECG-style progress line for the booking journey */
function pulseTracker(steps, idx){
  var out = '<div class="pulse-track">';
  for(var i=0;i<steps.length;i++){
    var state = i<idx ? 'done' : (i===idx ? 'active' : '');
    out += '<div class="pulse-node-wrap"><div class="pulse-node '+state+'"></div><span class="pulse-label '+(i<=idx?'on':'')+'">'+steps[i]+'</span></div>';
    if(i<steps.length-1){
      var segDone = i<idx;
      var segActive = i===idx;
      if(segActive){
        out += '<div class="pulse-seg"><svg viewBox="0 0 100 22" preserveAspectRatio="none"><path class="pulse-line-todo" d="M0 11 H100" stroke-width="2" fill="none"/><path class="pulse-beat" d="M0 11 H30 L38 3 L46 19 L54 11 H100" stroke-width="2.3" fill="none"/></svg></div>';
      } else {
        out += '<div class="pulse-seg"><svg viewBox="0 0 100 22" preserveAspectRatio="none"><path class="'+(segDone?'pulse-line-done':'pulse-line-todo')+'" d="M0 11 H100" stroke-width="2" fill="none"/></svg></div>';
      }
    }
  }
  out += '</div>';
  return out;
}

function submitRegister(){
  var name=document.getElementById('reg-name').value.trim();
  var email=document.getElementById('reg-email').value.trim();
  var phone=document.getElementById('reg-phone').value.trim();
  var pass=document.getElementById('reg-pass').value;
  var pass2=document.getElementById('reg-pass2').value;
  var terms=document.getElementById('reg-terms').checked;
  var e={};
  if(!name) e.name='Please enter your full name.';
  if(!email || !/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(email)) e.email='Please enter a valid email address.';
  if(!phone || phone.length<7) e.phone='Please enter a valid phone number.';
  if(!pass || pass.length<6) e.pass='Password must be at least 6 characters.';
  if(pass2!==pass || !pass2) e.pass2='Passwords do not match.';
  if(!terms) e.terms='Please accept the terms to continue.';
  S._regErrors=e;
  if(Object.keys(e).length){ render(); return; }
  S.user={name:name, email:email, phone:phone, role:'patient'};
  S.patientDetails={name:name, phone:phone, email:email};
  S._regErrors={};
  nav('patientDashboard', false);
  toast('Account created. Welcome, '+name.split(' ')[0]+'!');
}

function submitPayment(){
  var method=S.payMethod;
  S._payError=null;
  var cardEnds0000=false;
  if(method==='card'){
    var name=document.getElementById('pay-name').value.trim();
    var num=document.getElementById('pay-num').value.trim();
    var exp=document.getElementById('pay-exp').value.trim();
    var cvv=document.getElementById('pay-cvv').value.trim();
    if(!name||!num||!exp||!cvv){ S._payError='Please fill in all card details to continue.'; render(); return; }
    cardEnds0000 = num.replace(/\\s/g,'').slice(-4)==='0000';
  } else {
    var holder=document.getElementById('pay-holder').value.trim();
    if(!holder){ S._payError='Please enter the account holder name.'; render(); return; }
  }
  var payBtn=document.getElementById('pay-now-btn');
  if(payBtn) payBtn.disabled=true;
  nav('paymentProcessing');
  setTimeout(function(){
    if(cardEnds0000){ nav('paymentFailure', false); }
    else {
      var d = findDoctorById(S.booking.doctorId) || DOCTORS[0];
      var confirmation = 'MED-'+Math.floor(10000+Math.random()*89999);
      var newAppt = {id:'AP-'+Math.floor(10000+Math.random()*89999), doctor:d.name, specialty:d.specialty, hospital:d.hospital, date:S.booking.date+' 2026', time:S.booking.time, status:'Confirmed', payment:'Paid', fee:d.fee};
      appointments.unshift(newAppt);
      S.lastConfirmation=confirmation;
      S.activeAppointmentId=newAppt.id;
      nav('paymentSuccess', false);
    }
    render();
  }, 1700);
}

    '<div class="card-flat">'+

      '<div class="grid grid-3">'+
        field('Medicine name', '<div class="input-icon-wrap">'+textInput('ms-q','text','e.g. Paracetamol')+'<span class="input-icon-btn" style="pointer-events:none;">'+ic('search',18)+'</span></div>', {id:'ms-q'})+
        field('Hospital / pharmacy', '<select class="input" id="ms-hosp"><option>All Hospitals</option>'+HOSPITALS.map(function(h){return '<option>'+h+'</option>';}).join('')+'</select>', {id:'ms-hosp'})+
        '<div class="field" style="justify-content:flex-end;">'+btn('Search',{lg:true, icon:'search', onclick:'submitMedicineSearch()'})+'</div>'+
      '</div>'+
    '</div>';
  return appShell('patient','medicine','Medicine Availability',body);
}
function submitMedicineSearch(){
  var q=document.getElementById('ms-q').value.trim().toLowerCase();
  var hosp=document.getElementById('ms-hosp').value;
  S.medicineFilter={q:q, hospital:hosp};
  S.medicineResults = MEDICINES.filter(function(m){
    return (!q || m.name.toLowerCase().indexOf(q)>-1) && (hosp==='All Hospitals' || m.hospital===hosp);
  });
  nav('medicineResults');
}

function viewMedicineResults(){
  var results = S.medicineResults || [];
  var body =
    '<div class="row between wrap" style="margin-bottom:14px;">'+
      '<p class="small muted">'+results.length+' result'+(results.length===1?'':'s')+' for "'+(S.medicineFilter.q||'all medicines')+'"'+(S.medicineFilter.hospital&&S.medicineFilter.hospital!=='All Hospitals'?' at '+S.medicineFilter.hospital:'')+'.</p>'+
      btn('New search',{variant:'ghost', sm:true, onclick:"nav('medicineSearch')"})+
    '</div>'+
    (results.length===0?
      '<div class="card-flat center" style="padding:40px 20px;"><span style="color:var(--mist);">'+ic('pill',34)+'</span><h3 class="h-sm" style="margin-top:12px;">No matching medicines found</h3><p class="small muted" style="margin-top:6px;">We could not find that medicine in our sample records.</p>'+
      '<div class="row" style="margin-top:16px;justify-content:center;">'+btn('Return to appointment planning',{sm:true, onclick:"nav('findDoctor')"})+btn('Search another hospital',{sm:true, variant:'ghost', onclick:"nav('medicineSearch')"})+'</div></div>'
      :
      '<div class="stack">'+results.map(function(m){
        return '<div class="card-flat"><div class="row between wrap"><div><div class="h-sm">'+m.name+'</div><div class="small muted" style="margin-top:3px;">'+m.hospital+'</div></div>'+medBadge(m.status)+'</div>'+
        '<div class="row between" style="margin-top:10px;"><span class="small">'+m.stock+'</span><span class="small muted">Updated '+m.updated+'</span></div>'+
        (m.status==='unavailable'?'<div class="row" style="margin-top:12px;">'+btn('Search another hospital',{sm:true, variant:'ghost', onclick:"nav('medicineSearch')"})+'</div>':'')+
        '</div>';
      }).join('')+'</div>'
    );
  return appShell('patient','medicine','Medicine Results',body,{back:true});
}

function viewPatientPayments(){
  var body = '<div class="table-wrap"><table><thead><tr><th>Appointment</th><th>Doctor</th><th>Date</th><th>Amount</th><th>Status</th></tr></thead><tbody>'+
    appointments.map(function(a){
      return '<tr><td class="small" style="font-family:var(--font-mono);">'+a.id+'</td><td>'+a.doctor+'</td><td class="small">'+a.date+'</td><td class="small">Rs. '+a.fee.toLocaleString()+'</td><td>'+badge(a.payment)+'</td></tr>';
    }).join('')+'</tbody></table></div>';
  return appShell('patient','payments','Payments',body);
}

function viewMyAppointments(){
  var upcoming = appointments.filter(function(a){return a.status==='Confirmed'||a.status==='Pending Payment';});
  var previous = appointments.filter(function(a){return a.status==='Completed'||a.status==='Cancelled';});
  function apptCard(a){
    return '<div class="appt-card"><div class="row between wrap"><div><div class="h-sm">'+a.doctor+'</div><div class="small muted">'+a.specialty+' • '+a.hospital+'</div></div>'+badge(a.status)+'</div>'+
    '<div class="row" style="margin-top:8px;">'+ic('calendar',15)+'<span class="small">'+a.date+' at '+a.time+'</span></div>'+
    '<div class="row wrap" style="margin-top:12px;">'+
      btn('View Details',{sm:true, variant:'ghost', onclick:"S.activeAppointmentId='"+a.id+"';nav('appointmentDetails')"})+
      (a.status==='Confirmed'?btn('Reschedule',{sm:true, variant:'secondary', onclick:"S.activeAppointmentId='"+a.id+"';nav('reschedule')"}):'')+
      (a.status==='Confirmed'?btn('Cancel',{sm:true, variant:'danger-ghost', onclick:"confirmCancel('"+a.id+"')"}):'')+
    '</div></div>';
  }
  var body =
    '<h3 class="h-sm" style="margin-bottom:10px;">Upcoming</h3>'+
    (upcoming.length? '<div class="stack" style="margin-bottom:26px;">'+upcoming.map(apptCard).join('')+'</div>' : '<p class="small muted" style="margin-bottom:26px;">No upcoming appointments.</p>')+
    '<h3 class="h-sm" style="margin-bottom:10px;">Previous</h3>'+
    (previous.length? '<div class="stack">'+previous.map(apptCard).join('')+'</div>' : '<p class="small muted">No previous appointments yet.</p>');
  return appShell('patient','appointments','My Appointments',body);
}

function viewAppointmentDetails(){
  var a = findAppointment(S.activeAppointmentId) || appointments[0];
  var body = '<div class="card-flat" style="max-width:560px;">'+
    '<div class="row between"><h3 class="h-md">'+a.doctor+'</h3>'+badge(a.status)+'</div>'+
    '<div class="small muted" style="margin-top:4px;">'+a.specialty+'</div>'+
    '<hr class="divider">'+
    '<div class="stack">'+
      summaryRow('Hospital', a.hospital)+summaryRow('Date', a.date)+summaryRow('Time', a.time)+
      summaryRow('Appointment status', a.status)+summaryRow('Payment status', a.payment)+summaryRow('Amount', 'Rs. '+a.fee.toLocaleString())+
    '</div>'+
    (a.status==='Confirmed'?
    '<div class="row" style="margin-top:22px;">'+
      btn('Reschedule',{onclick:"nav('reschedule')"})+
      btn('Cancel Appointment',{variant:'danger-ghost', onclick:"confirmCancel('"+a.id+"')"})+
    '</div>' : '')+
    '</div>';
  return appShell('patient','appointments','Appointment Details',body,{back:true});
}

function confirmCancel(id){
  openModal(
    '<div class="center">'+
    '<span style="color:var(--coral);">'+ic('alertTriangle',36)+'</span>'+
    '<h3 class="h-md" style="margin-top:12px;">Are you sure you want to cancel this appointment?</h3>'+
    '<p class="small muted" style="margin-top:8px;">This action cannot be undone. Your slot will be released to other patients.</p>'+
    '<div class="stack" style="margin-top:20px;">'+
      btn('Yes, Cancel Appointment',{block:true, variant:'danger', onclick:"doCancel('"+id+"')"})+
      btn('Keep Appointment',{block:true, variant:'ghost', onclick:'closeModal()'})+
    '</div></div>'
  );
}
function doCancel(id){
  var a=findAppointment(id);
  if(a){ a.status='Cancelled'; a.payment='Refunded'; }
  closeModal();
  toast('Appointment cancelled.');
  nav('myAppointments', false);
}

function viewReschedule(){
  var a = findAppointment(S.activeAppointmentId) || appointments[0];
  var d = DOCTORS.filter(function(x){return x.name===a.doctor;})[0] || DOCTORS[0];
  if(!S._rsDate) S._rsDate = Object.keys(d.slots)[0];
  var times = d.slots[S._rsDate]||[];
  var allTimes = ['09:00 AM','10:00 AM','11:00 AM','01:00 PM','02:00 PM','03:00 PM','04:30 PM'];
  var body = '<div class="card-flat" style="max-width:560px;">'+
    '<p class="small muted">Currently scheduled for <b>'+a.date+' at '+a.time+'</b> with '+a.doctor+'.</p>'+
    '<h3 class="h-sm" style="margin-top:16px;">Select a new date</h3>'+
    '<div class="chip-row" style="margin-top:8px;">'+Object.keys(d.slots).map(function(dt){
      return '<button class="chip '+(S._rsDate===dt?'selected':'')+'" onclick="S._rsDate=\''+dt+'\';S._rsTime=null;render()">'+dt+'</button>';
    }).join('')+'</div>'+
    '<h3 class="h-sm" style="margin-top:18px;">Select a new time</h3>'+
    (times.length===0?'<div class="alert alert-info" style="margin-top:10px;">'+ic('alertTriangle',18)+'<span>No slots available on this date.</span></div>':
    '<div class="chip-row" style="margin-top:8px;">'+allTimes.map(function(t){
      var avail=times.indexOf(t)>-1;
      if(!avail) return '<button class="chip" disabled>'+t+'</button>';
      return '<button class="chip '+(S._rsTime===t?'selected':'')+'" onclick="S._rsTime=\''+t+'\';render()">'+t+'</button>';
    }).join('')+'</div>')+
    '<div class="row" style="margin-top:22px;">'+
      btn('Confirm Reschedule',{disabled:!(S._rsDate&&S._rsTime), onclick:'submitReschedule(\''+a.id+'\')'})+
      btn('Cancel',{variant:'ghost', onclick:'back()'})+
    '</div></div>';
  return appShell('patient','appointments','Reschedule Appointment',body,{back:true});
}
function submitReschedule(id){
  var a=findAppointment(id);
  if(a){ a.date=S._rsDate+' 2026'; a.time=S._rsTime; }
  S._rsDate=null; S._rsTime=null;
  toast('Appointment rescheduled successfully.');
  nav('appointmentDetails', false);
}

function viewProfile(){
  var role = S.user?S.user.role:'patient';
  var u = S.user || {name:'', email:'', phone:''};
  var body = '<div class="card-flat" style="max-width:480px;">'+
    field('Full name', textInput('pr-name','text','Full name', u.name), {id:'pr-name'})+
    field('Email address', textInput('pr-email','email','Email address', u.email), {id:'pr-email'})+
    (role==='patient'?field('Phone number', textInput('pr-phone','tel','Phone number', u.phone), {id:'pr-phone'}):'')+
    '<div class="row" style="margin-top:6px;">'+btn('Save Changes',{onclick:'saveProfile()'})+btn('Logout',{variant:'danger-ghost', icon:'logout', onclick:'doLogout()'})+'</div>'+
    '</div>';
  return appShell(role, role==='doctor'?'dprofile':role==='staff'?'sprofile':'profile','Profile',body);
}
function saveProfile(){
  if(S.user){
    S.user.name=document.getElementById('pr-name').value.trim()||S.user.name;
    S.user.email=document.getElementById('pr-email').value.trim()||S.user.email;
    var ph=document.getElementById('pr-phone'); if(ph) S.user.phone=ph.value.trim()||S.user.phone;
  }
  toast('Profile updated.');
  render();
}

/* =========================================================
   VIEWS — DOCTOR PORTAL
   ========================================================= */
function viewDoctorDashboard(){
  var today = doctorPatients.filter(function(p){return p.date==='Today';});
  var body =
    '<div class="grid grid-3" style="margin-bottom:20px;">'+
      statCard('calendar', today.length, "Today's appointments", 'teal')+
      statCard('clock', doctorPatients.length, 'Upcoming total', 'sky')+
      statCard('checkCircle', Object.values(S.doctorAvailability).reduce(function(a,b){return a+b.length;},0), 'Open slots this week', 'moss')+
    '</div>'+
    '<div class="grid grid-2">'+
      '<div class="card-flat"><h3 class="h-sm">Quick actions</h3><div class="stack" style="margin-top:12px;">'+
        btn('Manage Availability',{block:true, variant:'secondary', icon:'calendar', onclick:"nav('doctorAvailability')"})+
        btn('View Appointments',{block:true, variant:'secondary', icon:'clock', onclick:"nav('doctorSchedule')"})+
        btn('View Patients',{block:true, variant:'ghost', icon:'user', onclick:"nav('doctorSchedule')"})+
      '</div></div>'+
      '<div class="card-flat"><h3 class="h-sm">Today\'s schedule</h3><div class="stack" style="margin-top:12px;">'+
        (today.length? today.map(function(p){return '<div class="row between small"><span>'+p.name+' — '+p.time+'</span>'+badge(p.status)+'</div>';}).join('') : '<p class="small muted">No appointments scheduled for today.</p>')+
      '</div></div>'+
    '</div>';
  return appShell('doctor','ddashboard','Doctor Dashboard',body);
}
function statCard(icon,num,label,color){
  return '<div class="card-flat"><span style="color:var(--'+color+');">'+ic(icon,22)+'</span><div class="h-lg" style="margin-top:10px;">'+num+'</div><div class="small muted">'+label+'</div></div>';
}

function viewDoctorAvailability(){
  var slots = S.doctorAvailability;
  var allTimes = ['09:00 AM','10:00 AM','11:00 AM','01:00 PM','02:00 PM','03:00 PM','04:30 PM'];
  var body = '<div class="card-flat"><p class="small muted">Tap a time slot to mark it available or unavailable for patients booking online.</p>'+
    Object.keys(slots).map(function(dt){
      return '<div style="margin-top:20px;"><h3 class="h-sm">'+dt+'</h3><div class="chip-row" style="margin-top:10px;">'+
      allTimes.map(function(t){
        var on = slots[dt].indexOf(t)>-1;
        return '<button class="chip '+(on?'selected':'')+'" onclick="toggleSlot(\''+dt+'\',\''+t+'\')">'+(on?ic('check',13):'')+' '+t+'</button>';
      }).join('')+'</div></div>';
    }).join('')+
    '<div style="margin-top:26px;">'+btn('Update Availability',{lg:true, onclick:"toast('Availability updated.')"})+'</div>'+
    '</div>';
  return appShell('doctor','davail','Manage Availability',body);
}
function toggleSlot(dt,t){
  var arr=S.doctorAvailability[dt];
  var i=arr.indexOf(t);
  if(i>-1) arr.splice(i,1); else arr.push(t);
  render();
}

function viewDoctorSchedule(){
  var tab = S._docTab || 'today';
  var groups = {today: doctorPatients.filter(function(p){return p.date==='Today';}), upcoming: doctorPatients.filter(function(p){return p.date!=='Today' && p.status!=='Completed';}), previous: doctorPatients.filter(function(p){return p.status==='Completed';})};
  var body = '<div class="chip-row" style="margin-bottom:16px;">'+
    ['today','upcoming','previous'].map(function(t){return '<button class="chip '+(tab===t?'selected':'')+'" onclick="S._docTab=\''+t+'\';render()">'+t.charAt(0).toUpperCase()+t.slice(1)+'</button>';}).join('')+
    '</div>'+
    '<div class="table-wrap"><table><thead><tr><th>Patient</th><th>Date</th><th>Time</th><th>Status</th><th></th></tr></thead><tbody>'+
    groups[tab].map(function(p,i){
      return '<tr><td>'+p.name+'</td><td>'+p.date+'</td><td>'+p.time+'</td><td>'+badge(p.status)+'</td><td>'+btn('View',{sm:true, variant:'ghost', onclick:"S._activeDoctorPatient="+i+";S._docTabCache='"+tab+"';nav('doctorAppointmentDetails')"})+'</td></tr>';
    }).join('')+
    '</tbody></table></div>';
  return appShell('doctor','dappts','Appointment Schedule',body);
}

function viewDoctorAppointmentDetails(){
  var tab = S._docTabCache||'today';
  var groups = {today: doctorPatients.filter(function(p){return p.date==='Today';}), upcoming: doctorPatients.filter(function(p){return p.date!=='Today' && p.status!=='Completed';}), previous: doctorPatients.filter(function(p){return p.status==='Completed';})};
  var p = groups[tab][S._activeDoctorPatient||0] || doctorPatients[0];
  var body = '<div class="card-flat" style="max-width:480px;">'+
    '<h3 class="h-md">'+p.name+'</h3>'+
    '<div class="stack" style="margin-top:12px;">'+summaryRow('Date', p.date)+summaryRow('Time', p.time)+summaryRow('Status', p.status)+'</div>'+
    field('Update status', '<select class="input" id="doc-appt-status"><option '+(p.status==='Confirmed'?'selected':'')+'>Confirmed</option><option '+(p.status==='Completed'?'selected':'')+'>Completed</option><option '+(p.status==='Cancelled'?'selected':'')+'>Cancelled</option></select>', {id:'doc-appt-status'})+
    btn('Save Changes',{onclick:"p.status=document.getElementById('doc-appt-status').value;toast('Appointment updated.');render();"})+
    '</div>';
  return appShell('doctor','dappts','Appointment Details',body,{back:true});
}

/* =========================================================
   VIEWS — STAFF PORTAL
   ========================================================= */
function viewStaffDashboard(){
  var avail = DOCTORS.filter(function(d){return d.status!=='unavailable';}).length;
  var body = '<div class="grid grid-4" style="margin-bottom:20px;">'+
    statCard('user', DOCTORS.length, 'Total doctors', 'teal')+
    statCard('checkCircle', avail, 'Available doctors', 'moss')+
    statCard('calendar', appointments.length, 'Appointments', 'sky')+
    statCard('pill', MEDICINES.filter(function(m){return m.status==='available';}).length+'/'+MEDICINES.length, 'Medicines in stock', 'amber')+
    '</div>'+
    '<div class="card-flat"><h3 class="h-sm">Quick actions</h3><div class="row wrap" style="margin-top:12px;">'+
    btn('Manage Doctors',{variant:'secondary', onclick:"nav('staffDoctors')"})+
    btn('Manage Medicine',{variant:'secondary', onclick:"nav('staffMedicine')"})+
    btn('Appointments & Payments',{variant:'secondary', onclick:"nav('staffAppointments')"})+
    '</div></div>';
  return appShell('staff','sdashboard','Staff Dashboard',body);
}

function viewStaffDoctors(){
  var body = '<div class="row" style="margin-bottom:14px;max-width:360px;">'+field('Search doctors', '<div class="input-icon-wrap">'+textInput('sd-q','text','Search by name or specialty')+'<span class="input-icon-btn" style="pointer-events:none;">'+ic('search',18)+'</span></div>', {id:'sd-q'})+'</div>'+
    '<div class="table-wrap"><table><thead><tr><th>Doctor</th><th>Specialty</th><th>Hospital</th><th>Availability</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+
    DOCTORS.map(function(d){
      return '<tr><td>'+d.name+'</td><td>'+d.specialty+'</td><td>'+d.hospital+'</td><td>'+d.next+'</td><td>'+badge(d.status)+'</td>'+
      '<td class="row" style="border:none;gap:6px;">'+btn('Edit',{sm:true, variant:'ghost', onclick:"toast('Edit form opened (demo).')"})+btn('Update Availability',{sm:true, variant:'ghost', onclick:"toast('Availability editor opened (demo).')"})+'</td></tr>';
    }).join('')+'</tbody></table></div>';
  return appShell('staff','sdoctors','Manage Doctors',body);
}

function viewStaffMedicine(){
  var body = '<div class="table-wrap"><table><thead><tr><th>Medicine</th><th>Hospital</th><th>Availability</th><th>Stock status</th><th>Last updated</th><th>Actions</th></tr></thead><tbody>'+
    MEDICINES.map(function(m,i){
      return '<tr><td>'+m.name+'</td><td>'+m.hospital+'</td><td>'+medBadge(m.status)+'</td><td class="small">'+m.stock+'</td><td class="small muted">'+m.updated+'</td>'+
      '<td>'+btn('Update',{sm:true, variant:'ghost', onclick:"cycleMedStatus("+i+")"})+'</td></tr>';
    }).join('')+'</tbody></table></div>';
  return appShell('staff','smedicine','Manage Medicine Availability',body);
}
function cycleMedStatus(i){
  var order=['available','limited','unavailable'];
  var m=MEDICINES[i];
  var idx=(order.indexOf(m.status)+1)%3;
  m.status=order[idx];
  m.updated='Just now';
  m.stock = m.status==='available'?'In stock': m.status==='limited'?'Low stock':'Out of stock';
  toast(m.name+' at '+m.hospital+' updated to '+m.status+'.');
  render();
}

function viewStaffAppointments(){
  var body = '<div class="table-wrap"><table><thead><tr><th>ID</th><th>Doctor</th><th>Date</th><th>Time</th><th>Payment</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+
    appointments.map(function(a){
      return '<tr><td class="small" style="font-family:var(--font-mono);">'+a.id+'</td><td>'+a.doctor+'</td><td class="small">'+a.date+'</td><td class="small">'+a.time+'</td><td>'+badge(a.payment)+'</td><td>'+badge(a.status)+'</td>'+
      '<td>'+btn('Verify',{sm:true, variant:'ghost', onclick:"toast('Appointment "+a.id+" verified.')"})+'</td></tr>';
    }).join('')+'</tbody></table></div>';
  return appShell('staff','sappts','Appointment & Payment Management',body);
}

/* =========================================================
   ROUTER TABLE + RENDER
   ========================================================= */
var VIEWS = {
  landing: viewLanding,
  login: viewLogin,
  register: viewRegister,
  portalSelect: viewPortalSelect,
  doctorLogin: viewDoctorLogin,
  staffLogin: viewStaffLogin,
  patientDashboard: viewPatientDashboard,
  findDoctor: viewFindDoctor,
  doctorResults: viewDoctorResults,
  doctorDetails: viewDoctorDetails,
  selectSlot: viewSelectSlot,
  appointmentSummary: viewAppointmentSummary,
  patientDetails: viewPatientDetails,
  payment: viewPayment,
  paymentProcessing: viewPaymentProcessing,
  paymentSuccess: viewPaymentSuccess,
  paymentFailure: viewPaymentFailure,
  medicineSearch: viewMedicineSearch,
  medicineResults: viewMedicineResults,
  patientPayments: viewPatientPayments,
  myAppointments: viewMyAppointments,
  appointmentDetails: viewAppointmentDetails,
  reschedule: viewReschedule,
  profile: viewProfile,
  doctorDashboard: viewDoctorDashboard,
  doctorAvailability: viewDoctorAvailability,
  doctorSchedule: viewDoctorSchedule,
  doctorAppointmentDetails: viewDoctorAppointmentDetails,
  staffDashboard: viewStaffDashboard,
  staffDoctors: viewStaffDoctors,
  staffMedicine: viewStaffMedicine,
  staffAppointments: viewStaffAppointments
};

function render(){
  var fn = VIEWS[S.view] || viewLanding;
  document.getElementById('app').innerHTML = fn();
}
render();
</script>
</body>
</html>
